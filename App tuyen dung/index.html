<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tuyển dụng — Câu hỏi &amp; duyệt HR</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div>
        <h1>Ứng dụng tuyển dụng</h1>
        <p class="subtitle">Danh sách ứng viên lấy tự động từ Google Sheet đã xuất bản; có thể nhập Excel khi cần.</p>
        <p id="sheetHint" class="hint" style="margin-top:0.35rem"></p>
      </div>
      <div class="header-actions">
        <button type="button" class="btn btn-primary" id="btnReloadSheet">Tải lại từ Google Sheet</button>
        <label class="btn btn-secondary file-label">
          Nhập Excel (tuỳ chọn)
          <input id="fileInput" type="file" accept=".xlsx,.xls" hidden />
        </label>
        <button type="button" class="btn btn-ghost" id="btnExportState" title="Tải JSON trạng thái">Xuất trạng thái</button>
        <button type="button" class="btn btn-ghost" id="btnImportState">Nhập trạng thái</button>
        <input id="stateImport" type="file" accept="application/json" hidden />
      </div>
    </header>

    <section class="panel filters">
      <div class="row">
        <label>
          Lọc theo ngành
          <select id="filterIndustry"></select>
        </label>
        <label>
          Lọc trạng thái
          <select id="filterStatus">
            <option value="">Tất cả</option>
            <option value="new">Chưa tạo câu hỏi</option>
            <option value="pending_hr">Chờ HR duyệt</option>
            <option value="approved">Đã duyệt — chưa gửi HRM</option>
            <option value="sent_hrm">Đã gửi HRM</option>
            <option value="done">Hoàn tất</option>
          </select>
        </label>
        <label class="grow">
          Tìm kiếm
          <input type="search" id="search" placeholder="Tên, vị trí, email..." />
        </label>
      </div>
      <div class="row row-second">
        <label class="grow">
          Webhook HRM — POST JSON khi gửi (tùy chọn)
          <input type="url" id="hrmUrl" placeholder="https://..." />
        </label>
      </div>
      <p id="stats" class="stats"></p>
    </section>

    <div class="layout">
      <aside class="panel list-panel">
        <h2>Danh sách ứng viên</h2>
        <div id="candidateList" class="candidate-list"></div>
      </aside>
      <main class="panel detail-panel">
        <div id="emptyDetail" class="empty">Chọn một ứng viên trong danh sách (dữ liệu tải từ Google Sheet).</div>
        <div id="detail" class="detail hidden"></div>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>
  <script src="app.js" defer></script>
</body>
</html>
